<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jev · Email Organiser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #000;
    --paper: #fff;
    --rule: #e0e0e0;
    --rule-strong: #9e9e9e;
    --muted: #616161;
    --faint: #9e9e9e;
    --row-hover: #fafafa;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 56px 32px 96px; }

  header { border-bottom: 2px solid var(--ink); padding-bottom: 20px; margin-bottom: 28px; }

  h1 {
    font-family: Fraunces, serif;
    font-weight: 300;
    font-size: 42px;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
  }
  h1 em { font-weight: 600; font-style: normal; }

  .sub { color: var(--muted); font-size: 13px; letter-spacing: 0.02em; }

  .controls { display: flex; align-items: flex-end; gap: 20px; margin-bottom: 28px; flex-wrap: wrap; }

  label.field { display: flex; flex-direction: column; gap: 6px; }
  label.field span {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--muted); font-weight: 600;
  }
  input[type="number"], input[type="text"] {
    font: inherit; padding: 9px 12px; border: 1px solid var(--rule-strong);
    background: var(--paper); color: var(--ink); border-radius: 0;
  }
  input[type="text"] { min-width: 300px; font-family: "IBM Plex Mono", monospace; font-size: 12.5px; }
  input:focus { outline: 2px solid var(--ink); outline-offset: -1px; }

  button {
    font: inherit; font-weight: 600; letter-spacing: 0.04em;
    padding: 10px 22px; border: 1.5px solid var(--ink);
    background: var(--ink); color: var(--paper);
    cursor: pointer; border-radius: 0; transition: background .12s, color .12s;
  }
  button.ghost { background: var(--paper); color: var(--ink); }
  button:hover:not(:disabled) { background: var(--paper); color: var(--ink); }
  button.ghost:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
  button:disabled { opacity: .3; cursor: not-allowed; }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.14em; color: var(--muted); font-weight: 600;
    padding: 0 10px 10px; border-bottom: 1px solid var(--ink);
    white-space: nowrap;
  }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }

  tbody tr { border-bottom: 1px solid var(--rule); }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr.archive-row td:first-child { box-shadow: inset 3px 0 0 var(--ink); }
  tbody tr.review td { color: var(--faint); }

  td { padding: 13px 10px; vertical-align: top; }
  td.sender { color: var(--muted); font-size: 13px; white-space: nowrap;
              max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
  td.subject { font-weight: 500; max-width: 340px; }
  td.num { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; color: var(--muted); }
  td.num.strong { color: var(--ink); font-weight: 500; }

  .chip {
    display: inline-block; font-size: 10.5px; letter-spacing: 0.08em;
    text-transform: uppercase; font-weight: 600;
    padding: 3px 9px; border: 1px solid var(--rule-strong); color: var(--muted);
    white-space: nowrap;
  }
  .chip.solid { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .act { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
         color: var(--muted); white-space: nowrap; }
  .act.arch { color: var(--ink); font-weight: 600; }

  input[type=checkbox] { width: 17px; height: 17px; accent-color: #000; cursor: pointer; margin: 0; }
  input[type=checkbox]:disabled { cursor: not-allowed; opacity: .3; }

  .reasons { font-size: 11.5px; color: var(--faint); margin-top: 3px; font-style: italic; }

  .bar {
    position: sticky; bottom: 0; background: var(--paper);
    border-top: 2px solid var(--ink); padding: 16px 0;
    display: flex; align-items: center; gap: 18px; margin-top: 4px;
  }
  .tally { font-family: "IBM Plex Mono", monospace; font-size: 13px; }
  .tally b { font-weight: 500; }

  .msg { padding: 14px 18px; border-left: 3px solid var(--ink); background: #f5f5f5;
         margin-bottom: 22px; font-size: 13.5px; }
  .msg.err { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; }

  .empty { padding: 72px 0; text-align: center; color: var(--faint);
           font-family: Fraunces, serif; font-size: 20px; font-weight: 300; }

  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--rule-strong);
          border-top-color: var(--ink); border-radius: 50%; animation: r .7s linear infinite;
          vertical-align: -1px; margin-right: 8px; }
  @keyframes r { to { transform: rotate(360deg); } }

  tbody tr { animation: fade .25s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(3px); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Jev <em>Organiser</em></h1>
    <div class="sub" id="owner">Typed decisions for your inbox · review before applying</div>
  </header>

  <div class="controls">
    <label class="field"><span>Limit</span><input type="number" id="limit" value="25" min="1" max="200"></label>
    <label class="field"><span>Gmail query</span><input type="text" id="query" value="in:inbox is:unread newer_than:7d"></label>
    <button id="scan">Scan inbox</button>
  </div>

  <div id="message"></div>
  <div id="content"><div class="empty">Run a scan to see proposals.</div></div>
</div>

<script>
const $ = s => document.querySelector(s);
let rows = [], applied = false;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function note(html, cls = "") {
  $("#message").innerHTML = html ? `<div class="msg ${cls}">${html}</div>` : "";
}

async function scan() {
  const btn = $("#scan");
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>Judging…';
  note("");
  $("#content").innerHTML = '<div class="empty">Fetching mail and asking Jev — this takes a moment.</div>';

  try {
    const limit = encodeURIComponent($("#limit").value);
    const query = encodeURIComponent($("#query").value);
    const r = await fetch(`/api/scan?limit=${limit}&query=${query}`);
    const data = await r.json();

    if (data.error) { note(esc(data.error), "err"); $("#content").innerHTML = '<div class="empty">Scan failed.</div>'; return; }
    if (data.owner) $("#owner").textContent = `${data.owner} · review before applying`;

    rows = data.rows; applied = false;
    rows.length ? render() : ($("#content").innerHTML = '<div class="empty">No messages matched that query.</div>');
  } catch (e) {
    note(esc(e.message), "err");
  } finally {
    btn.disabled = false;
    btn.textContent = "Scan inbox";
  }
}

function render() {
  const body = rows.map(r => {
    const actionable = !r.needs_review && (r.labels.length || r.archive);
    // Archives start unticked so an unread Apply never removes mail from the inbox.
    const checked = actionable && !r.archive ? "checked" : "";
    const act = r.needs_review ? "held for review" : r.archive ? "label + archive" : r.labels.length ? "label" : "leave";

    return `<tr class="${r.archive ? "archive-row" : ""} ${r.needs_review ? "review" : ""}">
      <td><input type="checkbox" data-id="${esc(r.id)}" data-arch="${r.archive ? 1 : 0}"
           ${checked} ${actionable ? "" : "disabled"}></td>
      <td class="sender" title="${esc(r.sender)}">${esc(r.sender)}</td>
      <td class="subject">${esc(r.subject)}
        ${r.needs_review ? `<div class="reasons">${esc(r.review_reasons.join("; "))}</div>` : ""}</td>
      <td><span class="chip ${r.archive ? "solid" : ""}">${esc(r.category)}</span></td>
      <td class="num">${r.confidence.toFixed(2)}</td>
      <td class="num ${r.urgency >= 3 ? "strong" : ""}">${r.urgency.toFixed(1)}</td>
      <td class="num ${r.needs_reply >= .7 ? "strong" : ""}">${r.needs_reply.toFixed(2)}</td>
      <td class="num">${r.owner_must_act.toFixed(2)}</td>
      <td class="act ${r.archive ? "arch" : ""}">${act}</td>
    </tr>`;
  }).join("");

  $("#content").innerHTML = `
    <table>
      <thead><tr>
        <th></th><th>From</th><th>Subject</th><th>Category</th>
        <th class="num">Conf</th><th class="num">Urg</th>
        <th class="num">Reply</th><th class="num">Act</th><th>Action</th>
      </tr></thead>
      <tbody>${body}</tbody>
    </table>
    <div class="bar">
      <button id="apply">Apply</button>
      <button class="ghost" id="none">Clear all</button>
      <span class="tally" id="tally"></span>
    </div>`;

  $("#content").addEventListener("change", e => { if (e.target.type === "checkbox") tally(); });
  $("#apply").addEventListener("click", apply);
  $("#none").addEventListener("click", () => {
    document.querySelectorAll('tbody input[type=checkbox]').forEach(c => c.checked = false);
    tally();
  });
  tally();
}

function picked() {
  const label = [], archive = [];
  document.querySelectorAll("tbody input[type=checkbox]:checked").forEach(c => {
    label.push(c.dataset.id);
    if (c.dataset.arch === "1") archive.push(c.dataset.id);
  });
  return { label, archive };
}

function tally() {
  const { label, archive } = picked();
  $("#tally").innerHTML = `<b>${label.length}</b> to label · <b>${archive.length}</b> to archive`;
  $("#apply").disabled = applied || !label.length;
  $("#apply").textContent = archive.length
    ? `Apply ${label.length} labels, ${archive.length} archives`
    : `Apply ${label.length} labels`;
}

async function apply() {
  const { label, archive } = picked();
  if (archive.length && !confirm(`Archive ${archive.length} message(s)? They leave the inbox but stay in All Mail.`)) return;

  const btn = $("#apply");
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>Writing…';

  try {
    const r = await fetch("/api/apply", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ label_ids: label, archive_ids: archive })
    });
    const d = await r.json();

    if (d.error) { note(esc(d.error), "err"); btn.disabled = false; tally(); return; }

    applied = true;
    note(`Wrote <b>${d.labelled}</b> labelled and <b>${d.archived}</b> archived to Gmail. Scan again to continue.`);
    document.querySelectorAll("tbody input[type=checkbox]").forEach(c => c.disabled = true);
    btn.textContent = "Applied";
    window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (e) {
    note(esc(e.message), "err");
    btn.disabled = false;
  }
}

$("#scan").addEventListener("click", scan);
</script>
</body>
</html>
