<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jev · Email Organiser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #000;
    --paper: #fff;
    --rule: #e0e0e0;
    --rule-strong: #9e9e9e;
    --muted: #616161;
    --faint: #9e9e9e;
    --row-hover: #fafafa;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 56px 32px 96px; }

  header { border-bottom: 2px solid var(--ink); padding-bottom: 20px; margin-bottom: 28px; }

  h1 {
    font-family: Fraunces, serif;
    font-weight: 300;
    font-size: 42px;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
  }
  h1 em { font-weight: 600; font-style: normal; }

  .sub { color: var(--muted); font-size: 13px; letter-spacing: 0.02em; }

  .controls { display: flex; align-items: flex-end; gap: 20px; margin-bottom: 28px; flex-wrap: wrap; }

  label.field { display: flex; flex-direction: column; gap: 6px; }
  label.field span {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--muted); font-weight: 600;
  }
  input[type="number"], input[type="text"] {
    font: inherit; padding: 9px 12px; border: 1px solid var(--rule-strong);
    background: var(--paper); color: var(--ink); border-radius: 0;
  }
  input[type="number"]#limit {
    width: 124px; font-family: "IBM Plex Mono", monospace;
    font-size: 30px; font-weight: 500; text-align: center;
    padding: 10px 8px; border: 2px solid var(--ink); letter-spacing: -0.01em;
  }
  input[type="text"] { min-width: 300px; font-family: "IBM Plex Mono", monospace; font-size: 12.5px; }
  input:focus { outline: 2px solid var(--ink); outline-offset: -1px; }

  button {
    font: inherit; font-weight: 600; letter-spacing: 0.04em;
    padding: 10px 22px; border: 1.5px solid var(--ink);
    background: var(--ink); color: var(--paper);
    cursor: pointer; border-radius: 0; transition: background .12s, color .12s;
  }
  button.ghost { background: var(--paper); color: var(--ink); }
  button:hover:not(:disabled) { background: var(--paper); color: var(--ink); }
  button.ghost:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
  button:disabled { opacity: .3; cursor: not-allowed; }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.14em; color: var(--muted); font-weight: 600;
    padding: 0 10px 10px; border-bottom: 1px solid var(--ink);
    white-space: nowrap;
  }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }

  tbody tr { border-bottom: 1px solid var(--rule); }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr.archive-row td:first-child { box-shadow: inset 3px 0 0 var(--ink); }
  tbody tr.review td { color: var(--faint); }

  td { padding: 13px 10px; vertical-align: top; }
  td.sender { color: var(--muted); font-size: 13px; white-space: nowrap;
              max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
  td.subject { font-weight: 500; max-width: 340px; }
  td.num { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; color: var(--muted); }
  td.num.strong { color: var(--ink); font-weight: 500; }

  .chip {
    display: inline-block; font-size: 10.5px; letter-spacing: 0.08em;
    text-transform: uppercase; font-weight: 600;
    padding: 3px 9px; border: 1px solid var(--rule-strong); color: var(--muted);
    white-space: nowrap;
  }
  .chip.solid { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .act { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
         color: var(--muted); white-space: nowrap; }
  .act.arch { color: var(--ink); font-weight: 600; }

  input[type=checkbox] { width: 17px; height: 17px; accent-color: #000; cursor: pointer; margin: 0; }
  input[type=checkbox]:disabled { cursor: not-allowed; opacity: .3; }

  .reasons { font-size: 11.5px; color: var(--faint); margin-top: 3px; font-style: italic; }

  .bar {
    position: sticky; bottom: 0; background: var(--paper);
    border-top: 2px solid var(--ink); padding: 16px 0;
    display: flex; align-items: center; gap: 18px; margin-top: 4px;
  }
  .tally { font-family: "IBM Plex Mono", monospace; font-size: 13px; }
  .tally b { font-weight: 500; }

  /* pipeline + meter */
  .rig { border: 1px solid var(--rule); margin-bottom: 26px; display: none; }
  .rig.on { display: block; }

  .stages { display: grid; grid-template-columns: repeat(4, 1fr); }
  .stage { padding: 15px 18px; border-right: 1px solid var(--rule); position: relative; }
  .stage:last-child { border-right: 0; }
  .stage .n {
    font-family: "IBM Plex Mono", monospace; font-size: 10px;
    color: var(--faint); letter-spacing: .1em;
  }
  .stage .t {
    font-size: 12.5px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; margin-top: 3px; color: var(--faint);
    transition: color .2s;
  }
  .stage .d { font-size: 11.5px; color: var(--faint); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .stage.active .t, .stage.done .t { color: var(--ink); }
  .stage.active { background: #f7f7f7; }
  .stage.active::after {
    content: ""; position: absolute; left: 0; bottom: 0; height: 2px;
    background: var(--ink); width: 100%; transform-origin: left;
    animation: sweep 1.1s ease-in-out infinite;
  }
  .stage.done::after {
    content: ""; position: absolute; left: 0; bottom: 0; height: 2px;
    background: var(--ink); width: 100%;
  }
  @keyframes sweep { 0% { transform: scaleX(0); } 50% { transform: scaleX(1); } 100% { transform: scaleX(0); transform-origin: right; } }

  .meter { border-top: 1px solid var(--rule); padding: 15px 18px; display: flex;
           align-items: center; gap: 26px; flex-wrap: wrap; }
  .gauge { flex: 1 1 260px; min-width: 200px; }
  .gauge .track { height: 7px; background: #ededed; position: relative; overflow: hidden; }
  .gauge .fill { height: 100%; background: var(--ink); width: 0; transition: width .45s cubic-bezier(.2,.8,.2,1); }
  .gauge .ends { display: flex; justify-content: space-between; margin-top: 5px;
                 font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--faint); }

  .readout { display: flex; gap: 26px; }
  .stat .k { font-size: 9.5px; text-transform: uppercase; letter-spacing: .13em;
             color: var(--muted); font-weight: 600; }
  .stat .v { font-family: "IBM Plex Mono", monospace; font-size: 21px;
             font-weight: 500; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .stat .v small { font-size: 11px; color: var(--faint); font-weight: 400; }

  .msg { padding: 14px 18px; border-left: 3px solid var(--ink); background: #f5f5f5;
         margin-bottom: 22px; font-size: 13.5px; }
  .msg.err { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; }

  .empty { padding: 72px 0; text-align: center; color: var(--faint);
           font-family: Fraunces, serif; font-size: 20px; font-weight: 300; }

  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--rule-strong);
          border-top-color: var(--ink); border-radius: 50%; animation: r .7s linear infinite;
          vertical-align: -1px; margin-right: 8px; }
  @keyframes r { to { transform: rotate(360deg); } }

  tbody tr { animation: fade .25s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(3px); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Jev <em>Organiser</em></h1>
    <div class="sub" id="owner">Typed decisions for your inbox · review before applying</div>
  </header>

  <div class="controls">
    <label class="field"><span>Limit</span><input type="number" id="limit" value="25" min="1" max="200"></label>
    <label class="field"><span>Gmail query</span><input type="text" id="query" value="in:inbox is:unread newer_than:7d"></label>
    <button id="scan">Scan inbox</button>
  </div>

  <div class="rig" id="rig">
    <div class="stages">
      <div class="stage" data-s="fetch"><div class="n">01</div><div class="t">Fetch</div><div class="d" data-d="fetch">—</div></div>
      <div class="stage" data-s="judge"><div class="n">02</div><div class="t">Jev judges</div><div class="d" data-d="judge">—</div></div>
      <div class="stage" data-s="decide"><div class="n">03</div><div class="t">Policy decides</div><div class="d" data-d="decide">—</div></div>
      <div class="stage" data-s="apply"><div class="n">04</div><div class="t">Apply</div><div class="d" data-d="apply">—</div></div>
    </div>
    <div class="meter">
      <div class="gauge">
        <div class="track"><div class="fill" id="fill"></div></div>
        <div class="ends"><span id="spent">0 tokens</span><span id="budget">budget —</span></div>
      </div>
      <div class="readout">
        <div class="stat"><div class="k">Tokens in</div><div class="v" id="tok">0</div></div>
        <div class="stat"><div class="k">Cost</div><div class="v" id="cost">$0</div></div>
        <div class="stat"><div class="k">Per email</div><div class="v" id="per">—</div></div>
      </div>
    </div>
  </div>

  <div id="message"></div>
  <div id="content"><div class="empty">Run a scan to see proposals.</div></div>
</div>

<script>
const $ = s => document.querySelector(s);
let rows = [], applied = false;

// Measured across real scans: a five-question request averages ~1.9k input
// tokens per email. Only used to scale the gauge before the true total lands.
const EXPECTED_TOKENS_PER_EMAIL = 2000;
const RATE_PER_MTOK = 0.042;

const money = usd => usd === 0 ? "$0"
  : usd < 0.01 ? (usd * 100).toFixed(3) + "¢"
  : "$" + usd.toFixed(4);

function stage(name, state, detail) {
  const el = document.querySelector(`.stage[data-s="${name}"]`);
  if (!el) return;
  el.classList.remove("active", "done");
  if (state) el.classList.add(state);
  if (detail !== undefined) document.querySelector(`[data-d="${name}"]`).textContent = detail;
}

function resetRig(limit) {
  $("#rig").classList.add("on");
  ["fetch","judge","decide","apply"].forEach(s => stage(s, null, "—"));
  const budget = limit * EXPECTED_TOKENS_PER_EMAIL;
  $("#budget").textContent = `est. ${budget.toLocaleString()} tokens`;
  $("#spent").textContent = "0 tokens";
  $("#fill").style.width = "0%";
  $("#tok").textContent = "0";
  $("#cost").textContent = "$0";
  $("#per").textContent = "—";
  return budget;
}

function meter(tokens, emails, budget) {
  const usd = tokens / 1e6 * RATE_PER_MTOK;
  $("#tok").textContent = tokens.toLocaleString();
  $("#cost").textContent = money(usd);
  $("#per").innerHTML = emails
    ? Math.round(tokens / emails).toLocaleString() + ' <small>tok</small>'
    : "—";
  $("#spent").textContent = `${tokens.toLocaleString()} tokens`;
  $("#fill").style.width = Math.min(100, budget ? tokens / budget * 100 : 0) + "%";
}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function note(html, cls = "") {
  $("#message").innerHTML = html ? `<div class="msg ${cls}">${html}</div>` : "";
}

async function scan() {
  const btn = $("#scan");
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>Running…';
  note("");
  $("#content").innerHTML = '<div class="empty">Working…</div>';

  const limitNum = Math.max(1, parseInt($("#limit").value, 10) || 25);
  const budget = resetRig(limitNum);

  // The scan is one round trip, so stage progress is indicative: fetch is brief,
  // the judging phase is where nearly all the wall-clock goes.
  stage("fetch", "active", "reading inbox");
  const t0 = performance.now();
  let judging;

  try {
    const q = encodeURIComponent($("#query").value);
    const req = fetch(`/api/scan?limit=${limitNum}&query=${q}`);

    judging = setTimeout(() => {
      stage("fetch", "done", "done");
      stage("judge", "active", `up to ${limitNum} emails`);
    }, 900);

    const data = await (await req).json();
    clearTimeout(judging);

    if (data.error) {
      stage("fetch", null, "—"); stage("judge", null, "—");
      note(esc(data.error), "err");
      $("#content").innerHTML = '<div class="empty">Scan failed.</div>';
      return;
    }

    if (data.owner) $("#owner").textContent = `${data.owner} · review before applying`;

    const u = data.usage || {};
    const secs = ((performance.now() - t0) / 1000).toFixed(1);
    stage("fetch", "done", `${data.rows.length} fetched`);
    stage("judge", "done", `${u.emails || 0} judged · ${secs}s`);
    stage("decide", "done", `${data.rows.filter(r => r.needs_review).length} held`);
    stage("apply", null, "awaiting your approval");
    meter(u.input_tokens || 0, u.emails || 0, budget);

    if (u.failed) note(`${u.failed} email(s) failed to judge and are held for review.`);

    rows = data.rows; applied = false;
    rows.length ? render() : ($("#content").innerHTML = '<div class="empty">No messages matched that query.</div>');
  } catch (e) {
    clearTimeout(judging);
    note(esc(e.message), "err");
  } finally {
    btn.disabled = false;
    btn.textContent = "Scan inbox";
  }
}

function render() {
  const body = rows.map(r => {
    const actionable = !r.needs_review && (r.labels.length || r.archive);
    // Archives start unticked so an unread Apply never removes mail from the inbox.
    const checked = actionable && !r.archive ? "checked" : "";
    const act = r.needs_review ? "held for review" : r.archive ? "label + archive" : r.labels.length ? "label" : "leave";

    return `<tr class="${r.archive ? "archive-row" : ""} ${r.needs_review ? "review" : ""}">
      <td><input type="checkbox" data-id="${esc(r.id)}" data-arch="${r.archive ? 1 : 0}"
           ${checked} ${actionable ? "" : "disabled"}></td>
      <td class="sender" title="${esc(r.sender)}">${esc(r.sender)}</td>
      <td class="subject">${esc(r.subject)}
        ${r.needs_review ? `<div class="reasons">${esc(r.review_reasons.join("; "))}</div>` : ""}</td>
      <td><span class="chip ${r.archive ? "solid" : ""}">${esc(r.category)}</span></td>
      <td class="num">${r.confidence.toFixed(2)}</td>
      <td class="num ${r.urgency >= 3 ? "strong" : ""}">${r.urgency.toFixed(1)}</td>
      <td class="num ${r.needs_reply >= .7 ? "strong" : ""}">${r.needs_reply.toFixed(2)}</td>
      <td class="num">${r.owner_must_act.toFixed(2)}</td>
      <td class="act ${r.archive ? "arch" : ""}">${act}</td>
    </tr>`;
  }).join("");

  $("#content").innerHTML = `
    <table>
      <thead><tr>
        <th></th><th>From</th><th>Subject</th><th>Category</th>
        <th class="num">Conf</th><th class="num">Urg</th>
        <th class="num">Reply</th><th class="num">Act</th><th>Action</th>
      </tr></thead>
      <tbody>${body}</tbody>
    </table>
    <div class="bar">
      <button id="apply">Apply</button>
      <button class="ghost" id="none">Clear all</button>
      <span class="tally" id="tally"></span>
    </div>`;

  $("#content").addEventListener("change", e => { if (e.target.type === "checkbox") tally(); });
  $("#apply").addEventListener("click", apply);
  $("#none").addEventListener("click", () => {
    document.querySelectorAll('tbody input[type=checkbox]').forEach(c => c.checked = false);
    tally();
  });
  tally();
}

function picked() {
  const label = [], archive = [];
  document.querySelectorAll("tbody input[type=checkbox]:checked").forEach(c => {
    label.push(c.dataset.id);
    if (c.dataset.arch === "1") archive.push(c.dataset.id);
  });
  return { label, archive };
}

function tally() {
  const { label, archive } = picked();
  $("#tally").innerHTML = `<b>${label.length}</b> to label · <b>${archive.length}</b> to archive`;
  $("#apply").disabled = applied || !label.length;
  $("#apply").textContent = archive.length
    ? `Apply ${label.length} labels, ${archive.length} archives`
    : `Apply ${label.length} labels`;
}

async function apply() {
  const { label, archive } = picked();
  if (archive.length && !confirm(`Archive ${archive.length} message(s)? They leave the inbox but stay in All Mail.`)) return;

  const btn = $("#apply");
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>Writing…';
  stage("apply", "active", "writing to Gmail");

  try {
    const r = await fetch("/api/apply", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ label_ids: label, archive_ids: archive })
    });
    const d = await r.json();

    if (d.error) {
      stage("apply", null, "failed");
      note(esc(d.error), "err"); btn.disabled = false; tally(); return;
    }

    applied = true;
    stage("apply", "done", `${d.labelled} labelled · ${d.archived} archived`);
    note(`Wrote <b>${d.labelled}</b> labelled and <b>${d.archived}</b> archived to Gmail. Scan again to continue.`);
    document.querySelectorAll("tbody input[type=checkbox]").forEach(c => c.disabled = true);
    btn.textContent = "Applied";
    window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (e) {
    stage("apply", null, "failed");
    note(esc(e.message), "err");
    btn.disabled = false;
  }
}

$("#scan").addEventListener("click", scan);
</script>
</body>
</html>
